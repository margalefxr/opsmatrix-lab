services:
  web:
    image: nginx:alpine
    container_name: opsmatrix-web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../layer2-perimeter/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../layer2-perimeter/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend_net
      - backend_net

  db:
    image: mariadb:10.11
    container_name: opsmatrix-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPassOps2026!
      MYSQL_DATABASE: opsmatrix_db
      MYSQL_USER: ops_user
      MYSQL_PASSWORD: OpsPass2026!
    networks:
      - backend_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
