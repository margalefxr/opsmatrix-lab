# Formato de log para la Fase 4: fecha, IP, petición, estado y datos TLS
# (en el 80 tls y cipher salen como "-" porque no hay TLS)
log_format mf0489 '$time_iso8601 client=$remote_addr:$remote_port '
                  'request="$request" status=$status '
                  'tls=$ssl_protocol cipher=$ssl_cipher';

# HTTP: todo lo que llegue por el 80 se manda a HTTPS
server {
    listen 80;
    server_name portal.opsmatrix.test;
    server_tokens off;   # no enseñar la versión de Nginx tampoco en el 80
    access_log /var/log/nginx/access.log mf0489;

    return 301 https://$host$request_uri;
}

# HTTPS: termina TLS y pasa la petición a la app
server {
    listen 443 ssl;
    server_name portal.opsmatrix.test;
    server_tokens off;

    # Rutas DENTRO del contenedor (montadas desde /etc/ssl del host en solo lectura)
    ssl_certificate     /etc/nginx/certs/servidor.crt;
    ssl_certificate_key /etc/nginx/certs/servidor.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # En la imagen oficial este archivo va a la salida del contenedor (docker logs)
    access_log /var/log/nginx/access.log mf0489;

    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
