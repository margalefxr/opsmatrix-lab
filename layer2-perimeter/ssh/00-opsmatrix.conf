# OpsMatrix Lab - SSH solo con clave (MF0489 Fase 5)
# Va en /etc/ssh/sshd_config.d/. Empieza por 00- para leerse antes que
# 50-cloud-init.conf, que pone "PasswordAuthentication yes" (en sshd gana el primer valor).
#
# Instalar SOLO después de comprobar que entras con clave:
#   sudo install -m 644 layer2-perimeter/ssh/00-opsmatrix.conf /etc/ssh/sshd_config.d/00-opsmatrix.conf
#   sudo sshd -t && sudo systemctl reload ssh
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
