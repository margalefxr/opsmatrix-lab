# Drop-in de systemd para Suricata (MF0489 Fase 4)
# Antes el servicio arrancaba con "--af-packet -i enp2s0": Suricata montaba
# DOS capturas sobre enp2s0 y cada alerta salía duplicada.
# Con solo --af-packet usa la interfaz del suricata.yaml (enp2s0) una vez.
#
# Instalar en la VM:
#   sudo install -D -m 644 layer1-telemetry/suricata/override.conf /etc/systemd/system/suricata.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart suricata
[Service]
ExecStart=
ExecStart=/usr/bin/suricata -D --af-packet -c /etc/suricata/suricata.yaml --pidfile /var/run/suricata/suricata.pid
