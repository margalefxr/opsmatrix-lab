# Comprobaciones automáticas en cada push: lo mismo que hice a mano en la Fase 5
name: checks

on: [push, pull_request]

# El token de GitHub solo puede leer el repo (mínimo privilegio)
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Acción fijada por commit y no por etiqueta: una etiqueta se puede mover
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Scripts sin errores (shellcheck)
        run: shellcheck -S warning scripts/*.sh

      - name: Compose válido
        run: cp .env.example .env && docker compose config --quiet

      - name: Python sin errores de sintaxis
        run: python3 -m py_compile layer3-services/app/app.py

      - name: Dependencias sin CVE conocidos (pip-audit)
        run: pipx run pip-audit -r layer3-services/app/requirements.txt

      # Solo los archivos que están en git: el .env del paso "Compose válido" no se sube
      - name: Sin secretos en el repo (detect-secrets)
        run: |
          pipx run detect-secrets scan > /tmp/secretos.json
          python3 -c "import json,sys; r=json.load(open('/tmp/secretos.json'))['results']; print(r or 'sin secretos'); sys.exit(1 if r else 0)"
